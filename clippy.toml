# Mechanical enforcement of DESIGN.md D-002 — "no std::net, std::time, tokio, or
# rand::thread_rng; time, network and randomness always enter as parameters."
#
# swarm-core is #![no_std], so it cannot reach any of these already. These lints
# cover swarm-sim, and every crate Phase 2 adds, where std IS available and the
# rule would otherwise rely on memory.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "RandomState is seeded per process, so iteration order differs between runs. Use BTreeMap. See DESIGN.md D-002." },
    { path = "std::collections::HashSet", reason = "Same nondeterministic iteration order as HashMap. Use BTreeSet. See DESIGN.md D-002." },
    { path = "std::time::SystemTime", reason = "DESIGN.md D-002: no wall clock, anywhere. Time enters as LogicalTime." },
    { path = "std::time::Instant", reason = "DESIGN.md D-002: no wall clock, anywhere. Time enters as LogicalTime." },
]

disallowed-methods = [
    { path = "rand::thread_rng", reason = "DESIGN.md D-002: randomness is injected, never implicitly seeded." },
    { path = "std::thread::sleep", reason = "DESIGN.md D-002: the simulator advances by ticks, never by real time." },
]
