[package]
name = "swarm-verify"
version = "0.1.0"
description = "Independent verification of swarm-core evidence: checks I1-I4 from a LogBundle and Spec alone, with no access to the process that produced them (I5/I6 are structural)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["verification", "distributed-systems", "cryptography"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
swarm-core.workspace = true

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["alloc"] }

[features]
# Off by default, never enabled in a normal build. Deliberately breaks
# `check_i1`'s grouping so it keys by the bundle's map key rather than by
# the signer — the false negative X1 fixed. `verify_chains` now excludes a
# misfiled chain before `check_i1` ever runs, so this mutant is unreachable
# through the full `verify` pipeline; `verify::tests::
# check_i1_groups_by_the_signer_not_by_the_map_key` calls `check_i1`
# directly to give `scripts/verify.sh` something real to catch.
mutant-verify-i1 = []
