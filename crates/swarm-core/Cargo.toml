[package]
name = "swarm-core"
version = "0.1.0"
description = "Verifiable swarm coordination: pure, no_std, sans-I/O state machine."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The zero-dependency era ends at M1, exactly as docs/spec.md §8
# anticipated: blake3 and ed25519-dalek, both no_std-capable. The crate
# itself remains no_std — proven by the thumbv7em cross-compile
# (docs/spec.md §3).
[dependencies]
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["alloc"] }

[features]
# Off by default, never enabled in a normal build. Deliberately breaks the
# task-claim tie-break so it depends on observation order instead of the
# entry set alone — the negative control for I3 (Task A2 of
# PHASE1-REMEDIATION.md). Exists only so `scripts/verify.sh` can prove the
# checker catches a real divergence.
mutant-i3 = []
